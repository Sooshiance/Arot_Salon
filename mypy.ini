[mypy]
plugins = mypy_django_plugin.plugin

# Django-specific configuration
django_settings_module = your_project.settings

# Core strictness settings (Django compatible)
check_untyped_defs = True
disallow_any_generics = True
disallow_any_unimported = False  # Relaxed for Django imports
disallow_subclassing_any = True
disallow_untyped_calls = False    # Relaxed for Django
disallow_untyped_decorators = False  # Relaxed for Django decorators
disallow_untyped_defs = False     # Relaxed for Django views/models
ignore_missing_imports = True     # Important for Django apps
no_implicit_optional = True
pretty = True
show_column_numbers = True
show_error_codes = True
show_error_context = True
strict_equality = True
warn_return_any = True
warn_unused_ignores = True

# Package and import configuration
namespace_packages = True
explicit_package_bases = True
follow_imports = normal
follow_imports_for_stubs = False
no_site_packages = False
no_silence_site_packages = False

# Disallow dynamic typing (relaxed for Django)
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False

# Untyped definitions and calls (relaxed for Django)
disallow_incomplete_defs = False

# None and Optional handling
implicit_optional = False
strict_optional = True

# Configuring warnings
warn_redundant_casts = True
warn_no_return = True
warn_unreachable = True

# Suppressing errors
ignore_errors = False

# Miscellaneous strictness flags
allow_untyped_globals = False
allow_redefinition = False
local_partial_types = False
implicit_reexport = True          # Important for Django
strict_concatenate = False
strict = False                    # Use individual strict flags instead

# Configuring error messages
hide_error_codes = False
color_output = True
error_summary = True
show_absolute_path = False
force_uppercase_builtins = False
force_union_syntax = False

# Incremental mode
incremental = True
cache_dir = .mypy_cache
sqlite_cache = False
cache_fine_grained = False
skip_version_check = False
skip_cache_mtime_checks = False

# Advanced options
pdb = False
show_traceback = False
raise_exceptions = False
warn_incomplete_stub = False
scripts_are_modules = False
warn_unused_configs = False
verbosity = 0

plugins = mypy_django_plugin.main

[mypy_django_plugin]
ignore_missing_model_attributes = True

[mypy-*.migrations.*]
ignore_errors = True
